name: Build Control
on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - debian
          - windows
          - macos
          - msix
          - freebsd

permissions:
  contents: write

jobs:
  linux:
    if: inputs.target == 'all' || inputs.target == 'linux'
    uses: ./.github/workflows/linux.yml
    secrets: inherit

  debian:
    if: inputs.target == 'all' || inputs.target == 'debian'
    uses: ./.github/workflows/debian.yml
    secrets: inherit

  windows:
    if: inputs.target == 'all' || inputs.target == 'windows'
    uses: ./.github/workflows/windows.yml
    secrets: inherit

  macos:
    if: inputs.target == 'all' || inputs.target == 'macos'
    uses: ./.github/workflows/macos.yml
    secrets: inherit

  freebsd:
    if: inputs.target == 'all' || inputs.target == 'freebsd'
    uses: ./.github/workflows/freebsd.yml
    secrets: inherit

  msix:
    needs: [windows]
    if: always() && (inputs.target == 'all' || inputs.target == 'msix')
    uses: ./.github/workflows/msix.yml
    secrets: inherit
