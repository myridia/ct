name: Macos
on:
  # push:
  #   branches: ["main"]
  #   tags:
  #     - '*'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write 
  issues: read
  packages: none

jobs:
  Build:
    runs-on: macos-15
    if: github.repository_owner == 'myridia'

    steps:
      - name: Install Rust
        run: |
          brew install tree 
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source $HOME/.cargo/env
          rustup component add llvm-tools-preview
          cargo --version 
          
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile 
        run: |
          cargo build --release  
      - name: List
        run: |
          cd target
          tree . 
      - name: Rename
        run: |
          cp target/release/ct ct_macos.app
          hdiutil create -volname "ct_macos" -srcfolder "ct_macos.app" -ov -format UDZO "ct_macos.dmg"



      - name: Release Silicon
        if: github.repository_owner == 'myridia'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: 'ct_macos.dmg'
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true 

    
          
